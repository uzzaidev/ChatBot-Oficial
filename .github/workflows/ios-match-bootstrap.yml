name: iOS Match Bootstrap (roda 1x)

# Gera/renova certificado e perfil de distribuição (fastlane match). Só à mão.
# Capability nova no App ID invalida o perfil antigo: rodar este antes do ios-release.
# Runner macOS conta 10x na cota do Actions: timeout obrigatório.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-match-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Gerar certs de distribuição (fastlane match)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Run fastlane setup_certs
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane setup_certs
