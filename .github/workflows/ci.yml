name: CI

# Typecheck + testes em push e PR para a main.
# Cota do Actions: a conta uzzaidev é Free e é dividida com UzzOPS, Liga e Convoca
# (a Liga ficou bloqueada por cota/storage desde 13/10/2026). Por isso:
#   - commit só de docs/checkpoints/nativo não dispara (paths-ignore);
#   - push novo na mesma ref cancela o run anterior (concurrency);
#   - todo job tem timeout.
# Actions fixadas por SHA (tag pode ser trocada por quem controla a action).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "checkpoints/**"
      - "Checkpoint OFICIAL/**"
      - "**/*.md"
      - "android/**"
      - "ios/**"
      - "fastlane/**"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "checkpoints/**"
      - "Checkpoint OFICIAL/**"
      - "**/*.md"
      - "android/**"
      - "ios/**"
      - "fastlane/**"
      - ".claude/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache TypeScript incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            *.tsbuildinfo
            .tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'pnpm-lock.yaml') }}-

      - name: Type check
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run tests
        run: pnpm test --runInBand
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          META_ACCESS_TOKEN: test-meta-token
          OPENAI_API_KEY: test-openai-key
          GROQ_API_KEY: test-groq-key
